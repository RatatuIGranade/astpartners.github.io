name: 🚀 Deploy ASTERION Concord α Site

on:
  push:
    branches:
      - BedwarsLeaderboard  # если основная ветка называется иначе — укажи её (например, master)
  workflow_dispatch: # позволяет запускать вручную из вкладки Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .  # корневая папка, где лежит index.html

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
